<form [formGroup]="form" (ngSubmit)="save()">
  <mat-form-field>
    <mat-label>Nombre</mat-label>
    <input matInput formControlName="name" />
    <mat-error>Campo obligatorio</mat-error>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Título</mat-label>
    <input matInput formControlName="title" />
    <mat-error>Campo obligatorio</mat-error>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Experiencia</mat-label>
    <textarea matInput formControlName="experience"></textarea>
    <mat-error>Campo obligatorio</mat-error>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Habilidades</mat-label>
    <textarea matInput formControlName="skills"></textarea>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Formación</mat-label>
    <textarea matInput formControlName="education"></textarea>
  </mat-form-field>
  <mat-form-field>
    <mat-label>Email</mat-label>
    <input matInput formControlName="email" />
    @if (form.get('email')?.hasError('email')) {
      <mat-error>Email no válido</mat-error>
    } @else {
      <mat-error>Campo obligatorio</mat-error>
    }
  </mat-form-field>
  <mat-form-field>
    <mat-label>Teléfono</mat-label>
    <input matInput formControlName="phone" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Localidad</mat-label>
    <input matInput formControlName="location" />
  </mat-form-field>
  <mat-form-field>
    <mat-label>Idiomas</mat-label>
    <input matInput formControlName="languages" />
  </mat-form-field>
  <button [disabled]="form.invalid" matButton="filled" type="submit">Guardar</button>
  @if (saved()) {
    <p>Perfil guardado ✅</p>
  }
</form>
